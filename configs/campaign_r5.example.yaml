# =============================================================================
# Example character-likeness chain — ROUND 5 (Klippbok RE-CAPTION warm-restart, 3000 steps).  LTX-2.3-22b, video-only.
#
# Genericized from a production campaign config. The D-9-CHAINED warm-restart tail:
# identical LOCKED recipe as campaign_r1, EXCEPT training.init_adapter_path warm-starts
# the trainable adapter from a prior round's FINAL checkpoint (fresh optimizer at step 0 —
# the chain seam, 09-05). FINAL round of the STRICT forgetting-on-purpose chain: FULL
# dataset (15/16 clips — operator 2026-07-12: 'as many appropriately sized available
# datapoints as possible'; the 9f portrait (~0.5s) is excluded as below meaningful
# temporal signal — veto point). Dense F-buckets so mid-length clips train at REAL
# lengths instead of the 25f floor: 17<-{17,21}f, 25<-{25,29}f, 33<-{33,37}f,
# 41<-41f x2, 49<-53f, 81<-81f x4, portrait 81<-81f x2.
#
# Every precedent→signet deviation is in the campaign's deviation ledger (never silent).
# All gate-finalized fields were locked at the Wave-3 gate (operator, 2026-07-10).
#
# Zero GPU / zero spend to author.
# =============================================================================

# FINALIZED at the Wave-3 gate (operator 2026-07-10) — see campaign_r1.example.yaml; the chain shares
# the two-bucket layout (832x480x25 landscape + 416x736x25 portrait, F=25 floor → 13/16 clips).
training_dims: [1280, 704, 81]  # heaviest bucket (multi-F)

data:
  # r2 REUSES r1's encoded corpus (decided at the Wave-3 prep stage): the warm restart is
  # via the adapter (init_adapter_path below); same data, same buckets — no second encode,
  # no second encode spend. Logged in DECISION-LOG.md (09-07 Task 2). Path is on the
  # signe-trainer-dataset Volume (/dataset mount — signet convention, not the prior project's /vol).
  preprocessed_data_root: /dataset/.precomputed_campaign_recap  # r5: FRESH root, re-encoded from the Klippbok re-captions (2026-07-14); old .precomputed_campaign_full left intact
  metadata_path: /dataset/campaign/metadata.jsonl
  num_dataloader_workers: 2
  batch_size: 1
  resolution_buckets:  # MAXIMAL set (r4 full-dataset; F must satisfy (F-1)%8==0)
    - 1280x704x17
    - 1280x704x25
    - 1280x704x33
    - 1280x704x41
    - 1280x704x49
    - 1280x704x81
    - 416x736x81

lora:
  rank: 42   # DEVIATION — precedent likeness rank (signet default 64); MUST match r1 for a clean warm restart
  alpha: 42  # DEVIATION — alpha == rank; MUST match r1
  dropout: 0.0
  target_modules:
    - attn1.to_q
    - attn1.to_k
    - attn1.to_v
    - attn1.to_out.0
    - attn2.to_q
    - attn2.to_k
    - attn2.to_v
    - attn2.to_out.0
    - ff.net.0.proj
    - ff.net.2

training:
  max_steps: 3000  # r5 warm-restart round (operator 2026-07-14): full 3000-step round on the Klippbok re-captioned data; warm from r4 checkpoint-7400, fresh counter 0→3000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  optimizer: adamw8bit
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  uniform_prob: 0.30
  # Scheduler CONFIRM resolved (operator 2026-07-10): precedent-faithful CONSTANT LR via
  # min_lr_ratio 1.0 (LambdaLR floor = peak → flat 5e-5). Matches r1.
  scheduler: cosine_with_min_lr  # label of the one built scheduler; min_lr_ratio 1.0 makes it constant
  min_lr_ratio: 1.0  # CONSTANT LR (precedent-faithful; ledger deviation #2 resolved)
  warmup_steps: 0
  checkpoint_every: 200
  keep_checkpoints: null  # KEEP ALL — operator 2026-07-12: do NOT delete checkpoints. 10k/200=50 ckpts; the prior `25` would silently prune the first 25. null = unbounded (CheckpointManager never prunes).
  mixed_precision: bf16
  gradient_checkpointing: true
  seed: 42
  # D-9-CHAINED warm-restart seam (09-05): warm-start the trainable adapter from the prior round's
  # FINAL checkpoint dir (Volume-relative under the checkpoints Volume; fresh optimizer at step 0).
  init_adapter_path: outputs/campaign_r4_mf/checkpoint-step-07400-loss-0.7658  # r5 warm-restart from r4's step-7400 adapter (operator 2026-07-14; fresh optimizer, re-captioned data)

offload:
  blocks_to_swap: 24  # OFFL-02 active block-swap; raised for native-res headroom

modal:
  hourly_rate_usd: 1.64      # DEVIATION — A100-80GB rate; the precedent used 4.0 (H100)
  cost_guardrail_usd: 40.0   # per-run guardrail sized for the 10k round (est below); SESSION cap ($200) is separate + needs the operator's bump before dispatch
  est_hours: 5.5             # r5: 3000 steps at ~545/hr ≈ 5.5h → train cost print ≈ $9; ALSO used for the preprocess dispatch (encode actual ~20min of 16 short clips, far under this print)
  huggingface_secret_name: my-huggingface-secret
  wandb_secret_name: my-wandb-secret
  # wandb: secret attached but NO train_loop logging wired — a NO-OP here (see ledger).

validation:
  interval: 250
  in_loop_sampling: true
  num_inference_steps: 40  # operator-locked eval spec (2026-07-10, prior campaign): 40 steps — supersedes the precedent 10-step render
  # Eval prompt SET (operator 2026-07-11: one prompt is never enough). in-loop renders prompts[0].
  prompts:
    - "the subject looks into the camera and breaks into a warm smile, then glances away, soft daylight, shallow-focus close-up"
    - "a cinematic film still of the subject in evening wear, classic key lighting"
    - "the subject walks briskly toward the camera down a rain-slicked neon street at night, handheld shot"
    - "In a sunlit kitchen, the subject laughs while flipping a pancake, then looks delighted as it lands"
    - "profile of the subject slowly turning from a side view to three-quarters, dramatic side lighting, medium close-up"
    - "the subject in casual modern streetwear spins around laughing in an autumn park as leaves fall, wide shot"
  frame_count: 81          # 5s eval clips (operator 2026-07-11; the locked eval spec: 81f) — inference longer than the 25f training windows, accepted
  guidance_scale: 4.0  # operator-locked eval spec
  num_samples: 1
  seed: 42
  width: 1280              # native-scale primary bucket (operator 2026-07-11)
  height: 704              # native-scale primary bucket (operator 2026-07-11)
  two_stage_upscale: false # precedent F5

conditioning:
  mode: none

seed: 42
output_dir: outputs/campaign_r5
